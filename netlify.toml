[build]
  command = "npm run build"
  publish = "dist"

# Proxy API requests to backend (must come before SPA fallback)
[[redirects]]
  from = "/api/*"
  to = "https://api-staging.staffpay.in/:splat"
  status = 200
  force = true

# Handle SPA routing - all routes go to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
